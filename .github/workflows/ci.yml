name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain
      run: |
        xcodebuild -version
        xcode-select -p
        swift --version
        swift package --version
    
    # We use our Makefile target which automatically installs swiftlint via Homebrew
    - name: Run Linter
      run: make lint

    - name: Build Application
      run: make build

    # Currently we don't have unit tests, but this ensures that if you add them later, they run automatically!
    - name: Run Tests
      run: make test
